<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa modelo TOPTEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Paleta del Manual de Marca TOPTEC */
  :root {
    --gris: #575756; --amarillo: #ffd500; --amarillo-2: #dfb100; --amarillo-3: #cea800;
    --azul: #0058a5; --azul-2: #00508f; --azul-3: #004a7d; --rojo: #e30613; --rojo-2: #bc2f27; --rojo-3: #a81815;
    --bg: #ececeb; --panel: #ffffff; --ink: #3a3a39; --muted: #6f6f6e; --line: #dcdcdb; --header: #575756;
    --escena: #e4e6e8; --chip: #f3f3f2;
    /* Acentos suaves (en lugar de amarillo, azul y rojo puros) */
    --franja-1: #8a8f94; --franja-2: #a3a8ac; --franja-3: #bcc0c3;
    --acento: #4f6475; --acento-suave: #e3e8ec; --acento-texto: #2f3e4a;
    --toptec: #d9bf5a; --toptec-fondo: #fbf6e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #3f3f3e; --panel: #575756; --ink: #ffffff; --muted: #dadad9; --line: #6d6d6c; --header: #2f2f2e;
      --escena: #333332; --chip: #4a4a49;
      --franja-1: #5c6166; --franja-2: #6e7378; --franja-3: #80858a;
      --acento: #9fb3c4; --acento-suave: #66707a; --acento-texto: #ffffff;
      --toptec: #c9b25a; --toptec-fondo: #5f5b48; }
  }
  :root[data-theme="dark"] { --bg: #3f3f3e; --panel: #575756; --ink: #ffffff; --muted: #dadad9; --line: #6d6d6c; --header: #2f2f2e;
    --escena: #333332; --chip: #4a4a49;
    --franja-1: #5c6166; --franja-2: #6e7378; --franja-3: #80858a;
    --acento: #9fb3c4; --acento-suave: #66707a; --acento-texto: #ffffff;
    --toptec: #c9b25a; --toptec-fondo: #5f5b48; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 Outfit, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: relative; color: #fff; padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    background:
      linear-gradient(135deg, var(--franja-1) 0 10px, var(--franja-2) 10px 20px, var(--franja-3) 20px 32px, transparent 32px) top left / 70px 50% no-repeat,
      linear-gradient(225deg, var(--franja-1) 0 10px, var(--franja-2) 10px 20px, var(--franja-3) 20px 32px, transparent 32px) top right / 70px 50% no-repeat,
      var(--header); }
  header .logo { padding-left: 26px; line-height: 1.1; }
  header b { font-size: 24px; font-weight: 800; letter-spacing: .02em; }
  header .sub { display: block; font-size: 13px; font-weight: 300; }

  main { max-width: 1320px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .escena { position: relative; overflow: hidden; }
  #lienzo { display: block; width: 100%; height: min(68vh, 620px); min-height: 360px; background: var(--escena); border-radius: 12px; touch-action: none; cursor: grab; }
  #lienzo.sobre-parte { cursor: pointer; }
  #lienzo:active { cursor: grabbing; }
  .ayuda { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none; }
  .ayuda span { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12.5px; color: var(--muted); }
  .controles { position: absolute; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .controles button { font: inherit; font-size: 13px; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .controles button[aria-pressed="true"] { background: var(--acento-suave); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
  .etiqueta { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-size: 12px; font-weight: 700; letter-spacing: .03em;
    background: var(--gris); color: #fff; padding: 3px 8px; border-radius: 999px; white-space: nowrap; opacity: .9; }
  .etiqueta.activa { background: var(--acento); color: #fff; opacity: 1; }

  aside { display: grid; gap: 12px; }
  .partes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 12px; }
  .partes button { font: inherit; text-align: left; cursor: pointer; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: grid; gap: 2px; }
  .partes button:last-child:nth-child(odd) { grid-column: span 2; }
  .partes button b { font-size: 15px; }
  .partes button span { font-size: 12.5px; color: var(--muted); }
  .partes button[aria-pressed="true"] { background: var(--acento-suave); border-color: var(--acento); color: var(--acento-texto); box-shadow: inset 3px 0 0 var(--acento); }
  .partes button[aria-pressed="true"] span { color: var(--acento-texto); }
  .detalle { padding: 16px; display: grid; gap: 12px; }
  .detalle h2 { margin: 0; font-size: 20px; }
  .detalle p { margin: 0; color: var(--muted); font-size: 14px; }
  .marcas { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .marcas li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; background: var(--chip); }
  .marcas li.toptec { border: 2px solid var(--toptec); background: var(--toptec-fondo); }
  .marcas .nombre { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 15.5px; }
  .marcas .lineas { font-weight: 400; color: var(--muted); font-size: 13px; }
  .marcas .productos { display: flex; flex-wrap: wrap; gap: 5px; }
  .marcas .productos span { font-size: 12px; border-radius: 999px; padding: 2px 8px; background: var(--panel); border: 1px solid var(--line); }
  .insignia { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .insignia.portafolio { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
  .vacio { color: var(--muted); font-size: 14px; }
  .especificaciones { width: 100%; border-collapse: collapse; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .especificaciones th, .especificaciones td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .especificaciones tr:last-child th, .especificaciones tr:last-child td { border-bottom: 0; }
  .especificaciones th { width: 38%; font-weight: 600; background: var(--acento-suave); color: var(--acento-texto); }
  .grupo { margin: 4px 0 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .nota { font-size: 12.5px; color: var(--muted); padding: 0 16px 14px; margin: 0; }

  /* Pantalla de carga */
  #pantallaCarga { position: fixed; inset: 0; z-index: 3000; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px;
    color: #fff; text-align: center; transition: opacity .35s ease;
    background:
      linear-gradient(135deg, var(--franja-1) 0 18px, var(--franja-2) 18px 36px, var(--franja-3) 36px 58px, transparent 58px) top left / 150px 150px no-repeat,
      linear-gradient(315deg, var(--franja-1) 0 18px, var(--franja-2) 18px 36px, var(--franja-3) 36px 58px, transparent 58px) bottom right / 150px 150px no-repeat,
      var(--header); }
  #pantallaCarga.lista { opacity: 0; pointer-events: none; }
  #pantallaCarga .marca-carga { line-height: 1.1; }
  #pantallaCarga .marca-carga b { display: block; font-size: 52px; font-weight: 800; letter-spacing: .02em; }
  #pantallaCarga .marca-carga span { display: block; font-size: 16px; font-weight: 300; }
  .girando { width: 64px; height: 64px; border-radius: 50%; border: 6px solid rgba(255, 255, 255, .18); border-top-color: #ffffff; animation: girar .9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .girando { animation-duration: 2.5s; } }
  #cargaTexto { font-size: 26px; font-weight: 600; max-width: 560px; }
  #pantallaCarga.error .girando { display: none; }
  #pantallaCarga button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 8px; cursor: pointer; background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .7); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="pantallaCarga" role="status" aria-live="polite">
  <div class="marca-carga" aria-label="TOPTEC, Casa modelo"><b>TOPTEC</b><span>Casa modelo</span></div>
  <div class="girando" aria-hidden="true"></div>
  <div id="cargaTexto">Cargando…</div>
  <button type="button" id="btnReintentarCarga" hidden>Reintentar</button>
</div>
<header>
  <div class="logo"><b>TOPTEC</b><span class="sub">Casa modelo: marcas por sistema constructivo</span></div>
</header>

<main>
  <section class="tarjeta escena" aria-label="Casa modelo en 3D">
    <canvas id="lienzo" aria-label="Casa en 3D. Usa los botones de la derecha para elegir una parte."></canvas>
    <div id="etiquetas"></div>
    <div class="controles">
      <button type="button" id="btnCubierta" aria-pressed="false" title="Quita la cubierta para ver los cielos">Quitar cubierta</button>
      <button type="button" id="btnCentrar">Centrar vista</button>
    </div>
    <div class="ayuda"><span>Arrastra para girar · rueda o pellizco para acercar</span><span>Clic en una parte de la casa</span></div>
  </section>

  <aside>
    <div class="tarjeta partes" id="partes" role="group" aria-label="Partes de la casa"></div>
    <div class="tarjeta">
      <div class="detalle" id="detalle" aria-live="polite"></div>
      <p class="nota" id="nota"></p>
    </div>
  </aside>
</main>

<script type="module">
// =====================================================================
//  DATOS EDITABLES: marcas por parte de la casa
// ---------------------------------------------------------------------
//  Competencia identificada por el equipo (tablero "¿Quién es nuestra competencia?").
//  Cada marca lleva:
//    marca:      nombre que se muestra
//    lineas:     (opcional) líneas o submarcas, p. ej. Eterboard
//    productos:  lo que aporta la marca en esa parte
//    portafolio: (opcional) true = la marca fabrica para esa parte, pero no
//                está en la lista del tablero
//  TOPTEC siempre sale primero, sin importar dónde se escriba.
// =====================================================================

// Placas para muros y cielo raso (las mismas marcas en Paredes y Cielos)
const PLACAS = [
  { marca: 'TOPTEC', productos: ['Placa fibrocemento'] },
  { marca: 'Eternit', lineas: ['Eterboard', 'Design'], productos: ['Placa fibrocemento'] },
  { marca: 'Etex', lineas: ['Superboard', 'Gyplac'], productos: ['Placa fibrocemento', 'Yeso RH', 'Yeso RF', 'Yeso estándar'] },
  { marca: 'Knauf', productos: ['Yeso RH', 'Yeso RF', 'Yeso estándar'] },
];

const MARCAS = {
  cubierta: [
    { marca: 'TOPTEC', productos: ['Teja fibrocemento', 'Teja polipropileno'] },
    { marca: 'Eternit', productos: ['Teja fibrocemento', 'Teja polipropileno'] },
    { marca: 'Etex', lineas: ['Proteja'], productos: ['Teja fibrocemento'] },
    { marca: 'Arkos', productos: ['Teja UPVC', 'Teja policarbonato', 'Teja alveolar'] },
    { marca: 'Sigma', productos: ['Teja UPVC', 'Teja policarbonato'] },
    { marca: 'Koyo', productos: ['Teja polipropileno', 'Teja policarbonato'] },
    { marca: 'Mathiesen', productos: ['Teja policarbonato', 'Teja metálica'] },
  ],
  paredes: PLACAS,
  cielos: PLACAS,
  entrepiso: [
    { marca: 'TOPTEC', productos: ['Placa fibrocemento'] },
    { marca: 'Eternit', lineas: ['Eterboard'], productos: ['Placa fibrocemento'] },
    { marca: 'Etex', lineas: ['Superboard'], productos: ['Placa fibrocemento'] },
    { marca: 'Knauf', productos: [], portafolio: true },
  ],
  tanques: [
    { marca: 'TOPTEC', productos: [] },
    { marca: 'Eternit', productos: [] },
    { marca: 'Etex', lineas: ['Acquaviva'], productos: [] },
    ...['Colempaques', 'Fontana','Rotoplas', 'Polinter', 'Delagua'].map(marca => ({ marca, productos: [] })),
  ],
};

// Textos y especificaciones de cada parte (la tabla que sale arriba de las marcas)
const PARTES = {
  cubierta: { nombre: 'Cubierta', resumen: 'Tejas y caballetes', texto: 'Cubierta en teja con sus caballetes y accesorios.',
    especificaciones: [['Materiales', 'Fibrocemento, polipropileno, UPVC, policarbonato, alveolar y metálica']] },
  paredes: { nombre: 'Paredes', resumen: 'Placas de 8 a 12 mm', texto: 'Muros en construcción liviana con placas de fibrocemento o de yeso.',
    especificaciones: [['Espesores', '8 a 12 mm'], ['Placa', 'Fibrocemento y yeso'], ['Tipos de yeso', 'RH (resistente a la humedad), RF (resistente al fuego) y estándar']] },
  cielos: { nombre: 'Cielos', resumen: 'Placas de 4 y 6 mm', texto: 'Cielo raso con placas delgadas de fibrocemento o de yeso.',
    especificaciones: [['Espesores', '4 y 6 mm'], ['Placa', 'Fibrocemento y yeso'], ['Tipos de yeso', 'RH (resistente a la humedad), RF (resistente al fuego) y estándar']] },
  entrepiso: { nombre: 'Pisos', resumen: 'Placas de 14 mm o más', texto: 'Entrepiso seco con placas de fibrocemento de alta densidad.',
    especificaciones: [['Espesores', '14 mm en adelante'], ['Placa', 'Fibrocemento']] },
  tanques: { nombre: 'Tanques', resumen: 'Almacenamiento de agua', texto: 'Tanques para almacenamiento de agua.',
    especificaciones: [['Capacidades', '500 L y 1.000 L'], ['Líneas', 'Económica, estándar, sistema séptico y agro']] },
};
// ======================= Fin de los datos editables =======================

const el = id => document.getElementById(id);
const escapar = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// TOPTEC primero, luego las del monitoreo y al final las de portafolio (el resto en el orden en que están escritas)
const marcas = Object.fromEntries(Object.entries(MARCAS).map(([parte, lista]) => [parte,
  lista.map((m, i) => ({ ...m, i })).sort((a, b) =>
    (b.marca === 'TOPTEC') - (a.marca === 'TOPTEC') || !!a.portafolio - !!b.portafolio || a.i - b.i)]));

el('nota').textContent = 'Competencia identificada por el equipo. "Portafolio" = la marca fabrica para esa parte, pero no está en la lista de competencia.';

let THREE, OrbitControls;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
} catch (e) {
  console.error(e);
  el('pantallaCarga').classList.add('error');
  el('cargaTexto').textContent = 'No se pudo cargar el visor 3D. Revisa tu conexión a internet.';
  el('btnReintentarCarga').hidden = false;
  el('btnReintentarCarga').addEventListener('click', () => location.reload());
  throw e;
}

// ================= Escena 3D =================
const lienzo = el('lienzo');
const renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const VISTA_INICIAL = new THREE.Vector3(12, 8.5, 17), CENTRO = new THREE.Vector3(1, 2.8, 0);
camera.position.copy(VISTA_INICIAL);
const controls = new OrbitControls(camera, lienzo);
controls.target.copy(CENTRO);
controls.enableDamping = true;
controls.minDistance = 8; controls.maxDistance = 40;
controls.maxPolarAngle = Math.PI / 2 - 0.05;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a80, 1.1));
const sol = new THREE.DirectionalLight(0xffffff, 1.6);
sol.position.set(10, 16, 8);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
scene.add(sol);

// Texturas sencillas dibujadas en un canvas (ondas de teja y juntas de placa)
function textura(dibujar, repetirX, repetirY) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  dibujar(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repetirX, repetirY); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Teja ondulada roja
const texTeja = textura(g => {
  const grad = g.createLinearGradient(0, 0, 256, 0);
  grad.addColorStop(0, '#7a2219'); grad.addColorStop(.5, '#c2483a'); grad.addColorStop(1, '#7a2219');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, 248, 256, 8);
}, 16, 5);
// Placas de 1.22 x 2.44 m: la textura se repite por metro, para que las juntas queden a escala en cualquier muro
const texPlaca = (fondo, junta) => textura(g => {
  g.fillStyle = fondo; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = junta; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
}, 1 / 1.22, 1 / 2.44);

const piezasPorParte = { cubierta: [], paredes: [], cielos: [], entrepiso: [], tanques: [] };
// Crea una pieza. Si lleva "parte", se puede elegir con el clic; si no, es decoración.
function pieza(parte, geometria, material, x, y, z, padre = scene) {
  const m = new THREE.Mesh(geometria, material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  if (parte) { m.userData.parte = parte; piezasPorParte[parte].push(m); }
  padre.add(m);
  return m;
}
const mat = (opciones) => new THREE.MeshStandardMaterial({ roughness: .85, metalness: 0, ...opciones });
const caja = (ancho, alto, fondo) => new THREE.BoxGeometry(ancho, alto, fondo);

// Medidas (metros): casa de 9 x 7, dos pisos de 2.8 m, cubierta a dos aguas.
// El frente (lado +z) queda abierto, en corte tipo casa de muñecas, para ver el interior.
const ANCHO = 9, FONDO = 7, PISO = 2.8, MURO = 0.15, LOSA = 0.2, CIELO = 0.03, ALTO_CUMBRE = 2.4, ALERO = 0.5;
const ALTO = PISO * 2, B = 0.2;                         // B = altura de la placa de cimentación
const XI = ANCHO / 2 - MURO, ZI = FONDO / 2 - MURO;     // cara interior de los muros
const ESCALERA = { x0: -XI, x1: -XI + 0.95, zInicio: 2.4, huella: 0.27, pasos: 16 };
ESCALERA.zFin = ESCALERA.zInicio - (ESCALERA.pasos - 1) * ESCALERA.huella;   // donde llega al segundo piso
const HUECO = { x0: -XI + 0.02, x1: ESCALERA.x1 + 0.05, z0: ESCALERA.zFin, z1: 1.75 };   // hueco del entrepiso sobre la escalera
const TANQUE = { x: ANCHO / 2 + 2.4, z: -2.0, base: 0.3, alto: 0.3 + 1.55 };

// Materiales
const matMuro = mat({ map: texPlaca('#eeeae2', '#d9d3c7') });
const matMuroInt = mat({ map: texPlaca('#f7f4ef', '#e4dfd5') });
const matEntrepiso = mat({ map: texPlaca('#bdb6a8', '#938c7f') });
const matCielo = mat({ map: texPlaca('#fbfaf7', '#e5e1d8'), side: THREE.DoubleSide });
const matTeja = mat({ map: texTeja, roughness: .65 });
const matMarco = mat({ color: 0xf2efe9 });
const matVidrio = new THREE.MeshStandardMaterial({ color: 0x9cc6dc, roughness: .05, metalness: .1, transparent: true, opacity: .35 });
const matMadera = mat({ color: 0x8f5f3a, roughness: .7 });
const matMaderaClara = mat({ color: 0xb98a5e, roughness: .7 });
const matMetal = mat({ color: 0x3b3b3b, roughness: .4, metalness: .5 });

// Terreno, andén y placa de cimentación (no se pueden elegir)
pieza(null, new THREE.CircleGeometry(22, 64), mat({ color: 0x93a882 }), 0, -0.02, 0).rotation.x = -Math.PI / 2;
pieza(null, caja(ANCHO + 0.5, B, FONDO + 0.5), mat({ color: 0xb3aea4 }), 0, B / 2, 0);
pieza(null, caja(ANCHO - 2 * MURO, 0.01, FONDO - MURO), mat({ color: 0xd8cbb6, roughness: .5 }), 0, B + 0.005, MURO / 2);   // piso cerámico

// ---------- Muros con vanos (ventanas y puertas que se ven por dentro y por fuera) ----------
// El muro se dibuja como un rectángulo de largo x alto con huecos, y se extruye con el grosor MURO.
// Las coordenadas de los huecos son locales: x desde el borde izquierdo del muro, y desde su base.
function rect(path, x0, y0, x1, y1) { path.moveTo(x0, y0); path.lineTo(x1, y0); path.lineTo(x1, y1); path.lineTo(x0, y1); path.closePath(); return path; }
function muro(parte, material, largo, alto, huecos, x, y, z, giroY = 0) {
  const grupo = new THREE.Group();
  grupo.position.set(x, y, z); grupo.rotation.y = giroY; scene.add(grupo);
  const forma = rect(new THREE.Shape(), 0, 0, largo, alto);
  for (const h of huecos) forma.holes.push(rect(new THREE.Path(), h.x, h.y, h.x + h.w, h.y + h.h));
  pieza(parte, new THREE.ExtrudeGeometry(forma, { depth: MURO, bevelEnabled: false }), material, 0, 0, 0, grupo);
  for (const h of huecos) (h.tipo === 'ventana' ? ventana : puerta)(grupo, h);
  return grupo;
}
function ventana(grupo, { x, y, w, h }) {
  const f = 0.05, d = MURO + 0.02, cx = x + w / 2, cy = y + h / 2;
  pieza(null, caja(w, f, d), matMarco, cx, y + h - f / 2, MURO / 2, grupo);
  pieza(null, caja(w, f, d), matMarco, cx, y + f / 2, MURO / 2, grupo);
  pieza(null, caja(f, h, d), matMarco, x + f / 2, cy, MURO / 2, grupo);
  pieza(null, caja(f, h, d), matMarco, x + w - f / 2, cy, MURO / 2, grupo);
  if (w > 1.1) pieza(null, caja(0.04, h, 0.06), matMarco, cx, cy, MURO / 2, grupo);          // parral central
  pieza(null, caja(w + 0.14, 0.04, MURO + 0.12), matMarco, cx, y - 0.02, MURO / 2, grupo);     // alféizar
  const vidrio = pieza(null, caja(w - 2 * f, h - 2 * f, 0.01), matVidrio, cx, cy, MURO / 2, grupo);
  vidrio.castShadow = false;
}
function puerta(grupo, { x, y, w, h, abierta = 0 }) {
  const f = 0.05, d = MURO + 0.02;
  pieza(null, caja(w, f, d), matMarco, x + w / 2, y + h - f / 2, MURO / 2, grupo);
  pieza(null, caja(f, h, d), matMarco, x + f / 2, y + h / 2, MURO / 2, grupo);
  pieza(null, caja(f, h, d), matMarco, x + w - f / 2, y + h / 2, MURO / 2, grupo);
  // La hoja gira sobre la bisagra (lado izquierdo del vano)
  const bisagra = new THREE.Group();
  bisagra.position.set(x + f, y, MURO / 2); bisagra.rotation.y = abierta; grupo.add(bisagra);
  const ancho = w - 2 * f, altoHoja = h - f - 0.01;
  pieza(null, caja(ancho, altoHoja, 0.04), matMadera, ancho / 2, altoHoja / 2, 0, bisagra);
  for (const lado of [-1, 1]) pieza(null, new THREE.SphereGeometry(0.035, 12, 8), matMetal, ancho - 0.1, 1.0, lado * 0.04, bisagra);
}

// Orientaciones: el muro se dibuja en el plano XY y se gira para ponerlo en su sitio.
const GIRO_IZQ = Math.PI / 2;   // muro izquierdo: el largo avanza de adelante hacia atrás
const GIRO_DER = -Math.PI / 2;  // muro derecho y divisiones: el largo avanza de atrás hacia adelante
const LARGO_LADO = FONDO - MURO;
const v1 = 0.9, v2 = PISO + 0.95;   // altura de los antepechos (primer y segundo piso)

// Muro de fondo
muro('paredes', matMuro, ANCHO, ALTO, [
  { tipo: 'ventana', x: 2.0, y: v1, w: 1.6, h: 1.3 },        // sala
  { tipo: 'ventana', x: 6.4, y: 1.2, w: 1.2, h: 1.0 },       // cocina
  { tipo: 'ventana', x: 2.0, y: v2, w: 1.4, h: 1.2 },        // estudio
  { tipo: 'ventana', x: 6.3, y: v2 + 0.1, w: 1.4, h: 1.1 },  // alcoba
], -ANCHO / 2, B, -FONDO / 2);
// Muro izquierdo (la escalera va contra este muro, por eso solo tiene ventanas arriba)
muro('paredes', matMuro, LARGO_LADO, ALTO, [
  { tipo: 'ventana', x: 1.8, y: v2, w: 1.2, h: 1.2 },
  { tipo: 'ventana', x: 4.4, y: v2, w: 1.2, h: 1.2 },
], -ANCHO / 2, B, FONDO / 2, GIRO_IZQ);
// Muro derecho, con la puerta principal
muro('paredes', matMuro, LARGO_LADO, ALTO, [
  { tipo: 'ventana', x: 1.0, y: 1.0, w: 1.2, h: 1.2 },       // cocina
  { tipo: 'puerta', x: 3.6, y: 0.02, w: 1.0, h: 2.15 },      // puerta principal
  { tipo: 'ventana', x: 1.2, y: v2, w: 1.4, h: 1.2 },
  { tipo: 'ventana', x: 3.8, y: v2, w: 1.2, h: 1.2 },
], ANCHO / 2, B, -FONDO / 2 + MURO, GIRO_DER);
// Esquinas del muro frontal (dejan ver que el frente existe, sin tapar el corte)
for (const lado of [-1, 1]) pieza('paredes', caja(1.3, ALTO, MURO), matMuro, lado * (XI - 0.65), B + ALTO / 2, FONDO / 2 - MURO / 2);
// Culatas: triángulos bajo la cubierta, encima de los muros laterales
const culata = new THREE.Shape();
culata.moveTo(0, 0); culata.lineTo(FONDO, 0); culata.lineTo(FONDO / 2, ALTO_CUMBRE); culata.closePath();
pieza('paredes', new THREE.ExtrudeGeometry(culata, { depth: MURO, bevelEnabled: false }), matMuro, -ANCHO / 2, B + ALTO, FONDO / 2).rotation.y = GIRO_IZQ;
pieza('paredes', new THREE.ExtrudeGeometry(culata, { depth: MURO, bevelEnabled: false }), matMuro, ANCHO / 2, B + ALTO, -FONDO / 2).rotation.y = GIRO_DER;
// Divisiones interiores con puerta abierta: cocina (primer piso) y alcoba (segundo piso)
const LARGO_DIV = 0.8 + ZI;
muro('paredes', matMuroInt, LARGO_DIV, PISO - LOSA - CIELO, [{ tipo: 'puerta', x: 2.4, y: 0.02, w: 0.9, h: 2.1, abierta: -1.2 }],
  1.5 + MURO / 2, B, -ZI, GIRO_DER);
muro('paredes', matMuroInt, LARGO_DIV, PISO - CIELO, [{ tipo: 'puerta', x: 2.4, y: 0.02, w: 0.9, h: 2.1, abierta: -1.2 }],
  0.5 + MURO / 2, B + PISO, -ZI, GIRO_DER);

// ---------- Pisos (entrepiso) y cielos ----------
// Placa horizontal: se dibuja en el plano (x, -z) y se acuesta. Va por dentro de los muros, sin salirse.
function placa(parte, material, y, grosor, conHueco) {
  const forma = rect(new THREE.Shape(), -XI, -(FONDO / 2 - 0.02), XI, ZI);
  if (conHueco) forma.holes.push(rect(new THREE.Path(), HUECO.x0, -HUECO.z1, HUECO.x1, -HUECO.z0));
  const m = pieza(parte, new THREE.ExtrudeGeometry(forma, { depth: grosor, bevelEnabled: false }), material, 0, y, 0);
  m.rotation.x = -Math.PI / 2;
  return m;
}
placa('entrepiso', matEntrepiso, B + PISO - LOSA, LOSA, true);
placa('cielos', matCielo, B + PISO - LOSA - CIELO, CIELO, true);   // cielo raso del primer piso
placa('cielos', matCielo, B + ALTO - CIELO, CIELO, false);         // cielo raso del segundo piso

// ---------- Escalera (contra el muro izquierdo, sube hacia el fondo) ----------
{
  const { pasos, huella } = ESCALERA, contrahuella = PISO / pasos, recorrido = (pasos - 1) * huella;
  const perfil = new THREE.Shape();
  perfil.moveTo(0, 0);
  for (let i = 0; i < pasos; i++) {
    perfil.lineTo(i * huella, (i + 1) * contrahuella);
    if (i < pasos - 1) perfil.lineTo((i + 1) * huella, (i + 1) * contrahuella);
  }
  perfil.lineTo(recorrido, PISO - 0.3); perfil.lineTo(0.5, 0); perfil.closePath();
  pieza(null, new THREE.ExtrudeGeometry(perfil, { depth: ESCALERA.x1 - ESCALERA.x0, bevelEnabled: false }), matMaderaClara,
    ESCALERA.x0, B, ESCALERA.zInicio).rotation.y = GIRO_IZQ;
  // Baranda alrededor del hueco, en el segundo piso
  const yb = B + PISO, altoB = 0.9, xb = HUECO.x1 + 0.03;
  pieza(null, caja(0.05, 0.05, HUECO.z1 - HUECO.z0), matMetal, xb, yb + altoB, (HUECO.z0 + HUECO.z1) / 2);
  pieza(null, caja(HUECO.x1 - HUECO.x0 + 0.03, 0.05, 0.05), matMetal, (HUECO.x0 + xb) / 2, yb + altoB, HUECO.z1 + 0.03);
  for (let z = HUECO.z0 + 0.5; z < HUECO.z1; z += 0.5) pieza(null, caja(0.03, altoB, 0.03), matMetal, xb, yb + altoB / 2, z);
  for (const x of [HUECO.x0 + 0.3, HUECO.x0 + 0.7, xb]) pieza(null, caja(0.03, altoB, 0.03), matMetal, x, yb + altoB / 2, HUECO.z1 + 0.03);
}

// ---------- Muebles sencillos (decoración) ----------
{
  const y1 = B, y2 = B + PISO, fondo = -ZI;
  const tela = mat({ color: 0x6f8291 }), blanco = mat({ color: 0xeeebe5 }), meson = mat({ color: 0x4a4a4a, roughness: .4 });
  // Sala: sofá, tapete y mesa de centro
  pieza(null, caja(2.0, 0.42, 0.85), tela, -1.7, y1 + 0.21, fondo + 0.45);
  pieza(null, caja(2.0, 0.45, 0.2), tela, -1.7, y1 + 0.64, fondo + 0.12);
  for (const lado of [-1, 1]) pieza(null, caja(0.18, 0.6, 0.85), tela, -1.7 + lado * 0.92, y1 + 0.3, fondo + 0.45);
  pieza(null, caja(2.4, 0.01, 1.5), mat({ color: 0xc9b79c }), -1.6, y1 + 0.015, -1.5);
  pieza(null, caja(1.0, 0.38, 0.55), matMadera, -1.7, y1 + 0.2, -1.6);
  // Cocina: mesón contra el muro derecho y comedor
  pieza(null, caja(0.6, 0.88, 2.2), blanco, XI - 0.3, y1 + 0.44, -2.1);
  pieza(null, caja(0.64, 0.04, 2.24), meson, XI - 0.32, y1 + 0.9, -2.1);
  pieza(null, caja(1.2, 0.05, 0.8), matMadera, 2.9, y1 + 0.75, -0.6);
  for (const [dx, dz] of [[-.55, -.35], [.55, -.35], [-.55, .35], [.55, .35]]) pieza(null, caja(0.05, 0.73, 0.05), matMadera, 2.9 + dx, y1 + 0.365, -0.6 + dz);
  // Alcoba: cama con cabecero, cobija y almohadas
  pieza(null, caja(1.5, 0.45, 2.0), blanco, 2.8, y2 + 0.225, fondo + 1.05);
  pieza(null, caja(1.6, 0.95, 0.08), matMadera, 2.8, y2 + 0.475, fondo + 0.04);
  pieza(null, caja(1.54, 0.08, 1.3), mat({ color: 0x7d9471 }), 2.8, y2 + 0.49, fondo + 1.4);
  for (const dx of [-0.38, 0.38]) pieza(null, caja(0.6, 0.12, 0.35), blanco, 2.8 + dx, y2 + 0.51, fondo + 0.3);
  // Estudio: escritorio
  pieza(null, caja(1.3, 0.05, 0.6), matMadera, -1.6, y2 + 0.75, fondo + 0.35);
  for (const dx of [-0.6, 0.6]) pieza(null, caja(0.05, 0.73, 0.55), matMadera, -1.6 + dx, y2 + 0.365, fondo + 0.35);
}

// ---------- Cubierta a dos aguas en teja roja ----------
const faldon = Math.hypot(FONDO / 2 + ALERO, ALTO_CUMBRE + ALERO * ALTO_CUMBRE / (FONDO / 2));
const inclinacion = Math.atan2(ALTO_CUMBRE, FONDO / 2);
for (const lado of [-1, 1]) {
  const f = pieza('cubierta', caja(ANCHO + 2 * ALERO, 0.08, faldon), matTeja, 0, 0, 0);
  f.rotation.x = lado * inclinacion;
  const mitad = faldon / 2;
  f.position.set(0, B + ALTO + ALTO_CUMBRE - Math.sin(inclinacion) * mitad + 0.08, lado * Math.cos(inclinacion) * mitad);
}
pieza('cubierta', new THREE.CylinderGeometry(0.14, 0.14, ANCHO + 2 * ALERO, 16), mat({ color: 0x8e2b20, roughness: .6 }), 0, B + ALTO + ALTO_CUMBRE + 0.1, 0).rotation.z = Math.PI / 2;

// ---------- Tanque de agua al lado de la casa ----------
{
  const { x, z, base } = TANQUE, alto = 1.55, rAbajo = 0.62, rArriba = 0.78;
  pieza(null, caja(1.9, base, 1.9), mat({ color: 0xb3aea4 }), x, base / 2, z);
  const matTanque = mat({ color: 0x3e4349, roughness: .55 });
  pieza('tanques', new THREE.CylinderGeometry(rArriba, rAbajo, alto, 48), matTanque, x, base + alto / 2, z);
  for (const t of [0.3, 0.6]) {   // anillos de refuerzo
    const anillo = pieza('tanques', new THREE.TorusGeometry(rAbajo + (rArriba - rAbajo) * t + 0.01, 0.025, 8, 48), matTanque, x, base + alto * t, z);
    anillo.rotation.x = Math.PI / 2;
  }
  pieza('tanques', new THREE.CylinderGeometry(rArriba + 0.05, rArriba + 0.05, 0.08, 48), matTanque, x, base + alto + 0.04, z);
  pieza('tanques', new THREE.CylinderGeometry(0.25, 0.25, 0.06, 32), matTanque, x, base + alto + 0.11, z);
  // Tubo hacia la casa
  const largoTubo = x - rAbajo - ANCHO / 2;
  pieza(null, new THREE.CylinderGeometry(0.04, 0.04, largoTubo, 12), mat({ color: 0xd9d6cf }), ANCHO / 2 + largoTubo / 2, base + 0.15, z).rotation.z = Math.PI / 2;
}

// ---------- Jardín: camino de entrada y arbustos ----------
for (let i = 0; i < 5; i++) pieza(null, caja(0.7, 0.04, 0.9), mat({ color: 0xc8c1b4 }), ANCHO / 2 + 0.6 + i * 0.9, 0.02, 0.7);
const matArbusto = mat({ color: 0x55804a });
for (const [x, z, r] of [[-ANCHO / 2 - 0.7, 2.6, 0.55], [-ANCHO / 2 - 0.7, -2.4, 0.5], [-ANCHO / 2 - 0.6, 0.1, 0.4], [ANCHO / 2 + 0.7, 2.8, 0.5], [ANCHO / 2 + 1.3, -3.6, 0.45]])
  pieza(null, new THREE.SphereGeometry(r, 20, 14), matArbusto, x, r * 0.8, z);

// ================= Selección =================
const RESALTE = new THREE.Color(0x7fa6c4);   // azul grisáceo suave para la parte elegida
let seleccion = null, encima = null;
function pintarResaltado() {
  for (const [parte, piezas] of Object.entries(piezasPorParte)) {
    for (const m of piezas) {
      const activa = parte === seleccion, sobre = parte === encima && !activa;
      m.material = m.userData.base || (m.userData.base = m.material);
      if (activa || sobre) {
        m.material = m.userData.resaltado || (m.userData.resaltado = m.userData.base.clone());
        m.material.emissive = RESALTE;
        m.material.emissiveIntensity = activa ? .4 : .15;
      }
    }
  }
  document.querySelectorAll('.etiqueta').forEach(e => e.classList.toggle('activa', e.dataset.parte === seleccion));
}

function elegir(parte) {
  seleccion = parte;
  document.querySelectorAll('#partes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.parte === parte)));
  if (parte === 'cielos' && cubiertaVisible) alternarCubierta();    // para ver los cielos se quita la cubierta
  if (parte === 'cubierta' && !cubiertaVisible) alternarCubierta(); // al elegir la cubierta, vuelve a aparecer
  pintarResaltado();
  pintarDetalle();
}

function pintarDetalle() {
  const caja = el('detalle');
  if (!seleccion) {
    caja.innerHTML = `<h2>Elige una parte de la casa</h2><p>Haz clic en la cubierta, las paredes, los cielos, los pisos o el tanque, o usa los botones de arriba, para ver qué marcas participan en ese sistema constructivo.</p>`;
    return;
  }
  const p = PARTES[seleccion], lista = marcas[seleccion];
  const tarjeta = m => `
      <li class="${m.marca === 'TOPTEC' ? 'toptec' : ''}">
        <div class="nombre"><span>${escapar(m.marca)}${m.lineas?.length ? ` <span class="lineas">(${escapar(m.lineas.join(', '))})</span>` : ''}</span>
          ${m.portafolio ? '<span class="insignia portafolio">Portafolio</span>' : ''}</div>
        ${m.productos?.length ? `<div class="productos">${m.productos.map(x => `<span>${escapar(x)}</span>`).join('')}</div>` : ''}
      </li>`;
  const especificaciones = p.especificaciones?.length ? `<table class="especificaciones"><tbody>
      ${p.especificaciones.map(([dato, valor]) => `<tr><th scope="row">${escapar(dato)}</th><td>${escapar(valor)}</td></tr>`).join('')}
    </tbody></table>` : '';
  caja.innerHTML = `<h2>${escapar(p.nombre)}</h2><p>${escapar(p.texto)}</p>
    ${especificaciones}
    <h3 class="grupo">Marcas · ${lista.length}</h3>
    ${lista.length ? `<ul class="marcas">${lista.map(tarjeta).join('')}</ul>` : '<p class="vacio">No hay marcas registradas para esta parte.</p>'}`;
}

el('partes').innerHTML = Object.entries(PARTES).map(([id, p]) =>
  `<button type="button" data-parte="${id}" aria-pressed="false"><b>${escapar(p.nombre)}</b><span>${escapar(p.resumen)} · ${marcas[id].length} marcas</span></button>`).join('');
el('partes').addEventListener('click', e => { const b = e.target.closest('button[data-parte]'); if (b) elegir(b.dataset.parte); });

// Cubierta visible u oculta (para ver los cielos del segundo piso)
let cubiertaVisible = true;
function alternarCubierta() {
  cubiertaVisible = !cubiertaVisible;
  piezasPorParte.cubierta.forEach(m => { m.visible = cubiertaVisible; });
  el('btnCubierta').setAttribute('aria-pressed', String(!cubiertaVisible));
  el('btnCubierta').textContent = cubiertaVisible ? 'Quitar cubierta' : 'Poner cubierta';
}
el('btnCubierta').addEventListener('click', alternarCubierta);
el('btnCentrar').addEventListener('click', () => { camera.position.copy(VISTA_INICIAL); controls.target.copy(CENTRO); controls.update(); });

// Clic (sin arrastrar) sobre una pieza
const rayo = new THREE.Raycaster(), puntero = new THREE.Vector2();
const elegibles = () => Object.values(piezasPorParte).flat().filter(m => m.visible);
function parteBajo(evento) {
  const r = lienzo.getBoundingClientRect();
  puntero.set(((evento.clientX - r.left) / r.width) * 2 - 1, -((evento.clientY - r.top) / r.height) * 2 + 1);
  rayo.setFromCamera(puntero, camera);
  return rayo.intersectObjects(elegibles(), false)[0]?.object.userData.parte || null;
}
let inicio = null;
lienzo.addEventListener('pointerdown', e => { inicio = { x: e.clientX, y: e.clientY }; });
lienzo.addEventListener('pointerup', e => {
  if (inicio && Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) < 6) { const p = parteBajo(e); if (p) elegir(p); }
  inicio = null;
});
lienzo.addEventListener('pointermove', e => {
  if (e.buttons) return;
  const p = parteBajo(e);
  if (p !== encima) { encima = p; lienzo.classList.toggle('sobre-parte', !!p); pintarResaltado(); }
});
lienzo.addEventListener('pointerleave', () => { if (encima) { encima = null; lienzo.classList.remove('sobre-parte'); pintarResaltado(); } });

// Etiquetas flotantes con el nombre de cada parte
const ANCLAS = {
  cubierta: new THREE.Vector3(0, B + ALTO + ALTO_CUMBRE + 0.6, 0),
  paredes: new THREE.Vector3(2.6, B + PISO + 0.5, -FONDO / 2 + MURO + 0.05),
  cielos: new THREE.Vector3(-1.2, B + ALTO - 0.3, FONDO / 2 - 0.5),       // cielo raso del segundo piso
  entrepiso: new THREE.Vector3(1.6, B + PISO + 0.2, FONDO / 2 - 0.4),
  tanques: new THREE.Vector3(TANQUE.x, TANQUE.alto + 0.9, TANQUE.z),
};
el('etiquetas').innerHTML = Object.keys(ANCLAS).map(p => `<span class="etiqueta" data-parte="${p}">${escapar(PARTES[p].nombre)}</span>`).join('');
const v = new THREE.Vector3();
function moverEtiquetas() {
  const r = lienzo.getBoundingClientRect();
  document.querySelectorAll('.etiqueta').forEach(e => {
    const parte = e.dataset.parte;
    e.hidden = parte === 'cubierta' && !cubiertaVisible;
    v.copy(ANCLAS[parte]).project(camera);
    e.style.left = `${(v.x + 1) / 2 * r.width}px`;
    e.style.top = `${(1 - v.y) / 2 * r.height}px`;
  });
}

// Fondo de la escena según el tema (claro u oscuro del sistema)
function colorFondo() { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--escena').trim() || '#e4e6e8'); }
colorFondo();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', colorFondo);

function ajustar() {
  const r = lienzo.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
new ResizeObserver(ajustar).observe(lienzo);
ajustar();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); moverEtiquetas(); });

pintarDetalle();
el('pantallaCarga').classList.add('lista');
setTimeout(() => el('pantallaCarga').remove(), 400);
</script>
</body>
</html>
